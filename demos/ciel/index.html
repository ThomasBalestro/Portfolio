<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://api.open-meteo.com https://geocoding-api.open-meteo.com; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="robots" content="noindex, follow" />
  <title>Ciel — Météo en temps réel (démo)</title>
  <meta name="description" content="Démo réalisée par Thomas Balestro : application météo connectée à l'API publique Open-Meteo." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233b82f6'/%3E%3Ccircle cx='26' cy='26' r='10' fill='%23fde68a'/%3E%3Cpath d='M20 46h26a8 8 0 0 0 0-16 12 12 0 0 0-23 4 6 6 0 0 0-3 12z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --glass: rgba(255,255,255,.14); --glass-2: rgba(255,255,255,.22); --line: rgba(255,255,255,.22); --ink: #fff; --soft: rgba(255,255,255,.75); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Figtree', sans-serif; color: var(--ink); min-height: 100vh; background: var(--sky, linear-gradient(170deg, #3b82f6, #60a5fa 45%, #93c5fd)); transition: background 1s ease; background-attachment: fixed; }
    body[data-sky="clear-day"] { --sky: linear-gradient(170deg, #1d6fe0, #4f9cf5 45%, #9cc9ff); }
    body[data-sky="cloud-day"] { --sky: linear-gradient(170deg, #5b7290, #8aa0bb 50%, #c3cfdc); }
    body[data-sky="rain"] { --sky: linear-gradient(170deg, #2f3e55, #4c5d78 50%, #7c8aa3); }
    body[data-sky="snow"] { --sky: linear-gradient(170deg, #7d93b0, #b7c6d9 55%, #e6edf5); }
    body[data-sky="storm"] { --sky: linear-gradient(170deg, #1e1b33, #3a3557 50%, #5d5878); }
    body[data-sky="night"] { --sky: linear-gradient(170deg, #0b1230, #1c2a5c 55%, #3b4a86); }
    .demo { background: rgba(0,0,0,.25); color: var(--soft); font-size: 12.5px; text-align: center; padding: 7px 16px; }
    .demo a { color: #fff; }
    .wrap { width: min(980px, 100% - 32px); margin: 0 auto; padding: 28px 0 48px; }
    .top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 28px; }
    .brand { font-weight: 800; font-size: 22px; margin-right: auto; display: flex; gap: 10px; align-items: center; }
    .search { position: relative; flex: 1 1 320px; max-width: 420px; }
    .search input { width: 100%; padding: 13px 16px 13px 42px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); color: #fff; font: inherit; backdrop-filter: blur(12px); }
    .search input::placeholder { color: var(--soft); }
    .search input:focus { outline: 2px solid #fff; outline-offset: 1px; }
    .search::before { content: '⌕'; position: absolute; left: 15px; top: 50%; transform: translateY(-52%); font-size: 20px; opacity: .8; }
    .results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: rgba(15,23,42,.92); backdrop-filter: blur(14px); border-radius: 14px; list-style: none; overflow: hidden; z-index: 10; display: none; }
    .results.show { display: block; }
    .results button { all: unset; display: block; width: 100%; box-sizing: border-box; padding: 12px 16px; cursor: pointer; }
    .results button:hover, .results button:focus-visible { background: rgba(255,255,255,.1); }
    .results small { color: var(--soft); margin-left: 6px; }
    .locate { border: 1px solid var(--line); background: var(--glass); color: #fff; border-radius: 14px; padding: 12px 16px; font: inherit; font-weight: 600; cursor: pointer; backdrop-filter: blur(12px); }
    .locate:hover { background: var(--glass-2); }
    .hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-bottom: 20px; }
    .card { background: var(--glass); border: 1px solid var(--line); border-radius: 24px; padding: 24px; backdrop-filter: blur(14px); }
    .place { font-size: 15px; color: var(--soft); font-weight: 500; }
    .place b { color: #fff; font-size: 26px; font-weight: 700; display: block; }
    .now { display: flex; align-items: center; gap: 18px; margin-top: 14px; }
    .icon { font-size: 76px; line-height: 1; filter: drop-shadow(0 8px 20px rgba(0,0,0,.2)); }
    .temp { font-size: 96px; font-weight: 300; line-height: .9; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .temp sup { font-size: 36px; vertical-align: top; position: relative; top: 10px; }
    .desc { font-size: 19px; font-weight: 600; margin-top: 10px; }
    .minmax { color: var(--soft); }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .metric { background: rgba(255,255,255,.1); border-radius: 18px; padding: 14px 16px; }
    .metric span { color: var(--soft); font-size: 13px; display: block; }
    .metric b { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .card h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .1em; color: var(--soft); font-weight: 600; margin-bottom: 14px; }
    #hourly { width: 100%; height: 150px; display: block; }
    .days { list-style: none; display: grid; }
    .days li { display: grid; grid-template-columns: 90px 40px 1fr 110px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .days li:last-child { border: 0; }
    .days .d { font-weight: 600; text-transform: capitalize; }
    .days .i { font-size: 24px; text-align: center; }
    .range { height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); position: relative; }
    .range span { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #a5f3fc, #fde68a, #fb923c); }
    .days .t { text-align: right; font-variant-numeric: tabular-nums; }
    .days .t em { font-style: normal; color: var(--soft); margin-right: 10px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .status { text-align: center; padding: 40px; color: var(--soft); }
    .error { background: rgba(127,29,29,.45); border-color: rgba(254,202,202,.4); }
    .credit { text-align: center; color: var(--soft); font-size: 12.5px; margin-top: 24px; }
    .credit a { color: #fff; }
    .skeleton { opacity: .55; }
    @media (max-width: 820px) { .hero, .grid2 { grid-template-columns: 1fr; } .temp { font-size: 76px; } .days li { grid-template-columns: 70px 32px 1fr 90px; gap: 8px; } }
  </style>
</head>
<body data-sky="clear-day">
<div class="demo">Démo interactive — données réelles Open-Meteo · Thomas Balestro · <a href="../../page/projets-web.html">Retour au portfolio</a></div>
<div class="wrap">
  <div class="top">
    <div class="brand">⛅ Ciel</div>
    <div class="search">
      <input id="q" type="search" placeholder="Rechercher une ville…" autocomplete="off" aria-label="Rechercher une ville" aria-controls="results" />
      <ul class="results" id="results" role="listbox"></ul>
    </div>
    <button class="locate" id="locate" type="button">◎ Ma position</button>
  </div>
  <div id="app"><div class="card status">Chargement de la météo…</div></div>
  <p class="credit">Données météo : <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo.com</a> (CC BY 4.0) · aucune clé d'API, aucune donnée personnelle stockée</p>
</div>
<script src="app.js" defer></script>
</body>
</html>
